<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>مين فينا؟ المجنونة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Readex+Pro:wght@400;600;700&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one stage — big host screen (TV/laptop) + compact phone controller, same file. Soft "evening sky" blue, single committed look. */
:root{
  --bg:#172a4b; --stage:#1e355e; --panel:#264272; --line:#3a5a92;
  --sky:#8cc8ff; --skydeep:#4d8fd6; --sun:#ffd685; --cream:#eef5ff; --muted:#aac0e2;
  --mint:#86e6c8; --coral:#ffa3b1; --ink:#0f1f3b; --card:#f5f9ff;
  --display:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@property --bg{syntax:"<color>";inherits:true;initial-value:#172a4b}
@property --g1{syntax:"<color>";inherits:true;initial-value:rgba(140,200,255,.22)}
@property --g2{syntax:"<color>";inherits:true;initial-value:rgba(134,230,200,.10)}
@property --g3{syntax:"<color>";inherits:true;initial-value:rgba(255,214,133,.08)}
:root{--g1:rgba(140,200,255,.22);--g2:rgba(134,230,200,.10);--g3:rgba(255,214,133,.08)}
/* scenes: 1 turquoise lagoon · 2 violet ink · 3 detective spotlight · 4 sunset finale · 5 golden night (results) */
:root[data-scene="1"]{--bg:#0f3644;--stage:#14475a;--panel:#1b586c;--line:#2d7389;--g1:rgba(95,225,210,.26);--g2:rgba(255,214,133,.10);--g3:rgba(140,200,255,.12)}
:root[data-scene="2"]{--bg:#221f50;--stage:#2c2866;--panel:#373278;--line:#4c4795;--g1:rgba(170,150,255,.26);--g2:rgba(255,163,177,.12);--g3:rgba(140,200,255,.10)}
:root[data-scene="3"]{--bg:#111a2d;--stage:#19243f;--panel:#212f51;--line:#33446d;--g1:rgba(255,214,133,.24);--g2:rgba(17,26,45,0);--g3:rgba(140,200,255,.07)}
:root[data-scene="4"]{--bg:#3a1c40;--stage:#4a2551;--panel:#5a2e61;--line:#78417a;--g1:rgba(255,165,115,.28);--g2:rgba(255,214,133,.14);--g3:rgba(255,120,150,.14)}
:root[data-scene="7"]{--bg:#153a2c;--stage:#1b4a38;--panel:#225a45;--line:#337559;--g1:rgba(134,230,200,.26);--g2:rgba(255,214,133,.12);--g3:rgba(140,200,255,.10)}
:root[data-scene="8"]{--bg:#3a1b26;--stage:#4a2431;--panel:#5a2d3c;--line:#7a4252;--g1:rgba(255,150,130,.26);--g2:rgba(255,214,133,.12);--g3:rgba(170,150,255,.10)}
:root[data-scene="6"]{--bg:#2a1f4d;--stage:#352863;--panel:#413174;--line:#5a4795;--g1:rgba(255,214,133,.32);--g2:rgba(255,163,177,.14);--g3:rgba(140,200,255,.12)}
:root[data-scene="5"]{--bg:#1e2147;--stage:#292c59;--panel:#34376a;--line:#4a4e8b;--g1:rgba(255,214,133,.30);--g2:rgba(140,200,255,.12);--g3:rgba(255,163,177,.12)}
html,body{height:100%}
body{
  margin:0;background-color:var(--bg);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.6;direction:rtl;
  transition:--bg 1.4s ease, --g1 1.4s ease, --g2 1.4s ease, --g3 1.4s ease, background-color 1.4s ease;
}
/* the glow sits on its own fixed layer: it is painted once, not again every time something on the page moves */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;will-change:transform;transform:translateZ(0);
  background-image:
    radial-gradient(70% 55% at 50% -15%, var(--g1), transparent 70%),
    radial-gradient(45% 40% at 0% 100%, var(--g2), transparent 70%),
    radial-gradient(45% 40% at 100% 100%, var(--g3), transparent 70%)}
:root[data-scene="3"] body::before{background-image:
    radial-gradient(38% 60% at 50% -10%, var(--g1), transparent 75%),
    radial-gradient(45% 40% at 0% 100%, var(--g2), transparent 70%),
    radial-gradient(45% 40% at 100% 100%, var(--g3), transparent 70%)}
.rules{margin:0;padding-inline-start:1.4em;text-align:start;max-width:40ch;font-size:clamp(1.3rem,2.8vw,1.8rem);display:flex;flex-direction:column;gap:8px}
.rules li::marker{font-family:var(--display);font-weight:800;color:var(--sky)}
.phone .rules{font-size:1.15rem}
.segintro .icon{font-size:4.5rem;line-height:1;display:block;margin-bottom:6px;animation:drop .7s cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{min-height:100%;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.disp{font-family:var(--display);font-weight:800;line-height:1.2;text-wrap:balance}
.muted{color:var(--muted)}
.btn{border:0;border-radius:16px;padding:14px 22px;font-size:1.1rem;font-weight:700;background:var(--sky);color:var(--ink);box-shadow:0 4px 0 var(--skydeep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--skydeep)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--cream);border:2px solid var(--line);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--cream);font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--sky);color:var(--ink);border-color:var(--sky)}
.field{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--ink);color:var(--cream);font:inherit;font-size:1.15rem}
.lbl{font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:600}

/* ---------- home ---------- */
.home{flex:1;display:grid;place-items:center;text-align:center}
.home h1{font-size:clamp(3rem,10vw,6.5rem);margin:0;color:var(--sun);text-shadow:0 5px 0 var(--ink)}
.home h1 small{display:block;font-size:.36em;color:var(--sky);margin-top:4px}
.home .pick{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:28px}
.home .pick{gap:14px}
.cast{display:flex;justify-content:center;gap:clamp(4px,1.5vw,14px);margin-bottom:6px}
.castm{width:clamp(44px,8vw,78px);height:clamp(44px,8vw,78px);display:inline-block;animation:bob 2.4s ease-in-out infinite;animation-delay:var(--d)}
.castm .avi{width:100%;height:100%}
.castm:nth-child(odd){transform:translateY(8px)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.steps{margin:12px 0 0;color:var(--muted);font-size:clamp(.88rem,2.6vw,1.02rem);white-space:nowrap;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px}
.steps i{font-style:normal;opacity:.5}
.resume{display:flex;align-items:center;gap:12px;margin:16px auto 0;padding:12px 18px;border-radius:18px;border:1.5px dashed rgba(255,214,133,.5);
  background:rgba(255,214,133,.06);color:var(--cream);font-family:inherit;cursor:pointer;text-align:start}
.resume>span:first-child{font-size:1.6rem}
.resume strong{display:block;color:var(--sun);font-size:1.05rem}
.resume small{color:var(--muted)}
.resume:hover{background:rgba(255,214,133,.12)}
.pickcard{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(240px,100%);padding:22px 18px 20px;border-radius:24px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(140,200,255,.22);color:var(--cream);font-family:inherit;cursor:pointer;
  transition:transform .18s ease, background .18s ease, border-color .18s ease}
.pickcard:hover{background:rgba(255,255,255,.08);border-color:rgba(140,200,255,.45);transform:translateY(-3px)}
.pickcard:active{transform:translateY(0) scale(.98)}
.pickcard:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.pickcard .pcic{font-size:2.6rem;line-height:1}
.pickcard strong{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--sun)}
.pickcard small{font-size:.88rem;color:var(--muted)}
.home .pickbtn{display:flex;flex-direction:column;align-items:center;gap:4px}
.home .pickbtn small{font-size:.85rem;font-weight:600;opacity:.75}
.home .hint{max-width:48ch;margin:22px auto 0;font-size:.95rem}
.warn{background:var(--panel);border:2px solid var(--coral);border-radius:14px;padding:12px 16px;margin-top:14px;max-width:60ch;text-align:start;font-size:.95rem}

/* ---------- host ---------- */
.hbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.code{display:flex;align-items:baseline;gap:12px}
.code b{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.1rem);color:var(--sun);letter-spacing:.12em;font-variant-numeric:tabular-nums;direction:ltr}
.hbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.segchip{font-family:var(--display);font-weight:800;color:var(--sun);font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.2}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:22px;text-align:center}
.qcard{max-width:28ch;font-size:clamp(2.2rem,5.2vw,3.8rem);margin:0;line-height:1.25}
.qsm{font-size:clamp(1.7rem,3.6vw,2.6rem)}
.kind{font-family:var(--display);font-weight:700;color:var(--coral);font-size:1.4rem}
.timer{--p:1;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--sky) calc(var(--p)*360deg), var(--panel) 0);font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--cream);position:relative;flex:none}
.timer::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--stage)}
.timer span{position:relative;font-variant-numeric:tabular-nums}
.timer.hot{background:conic-gradient(var(--coral) calc(var(--p)*360deg), var(--panel) 0)}
.timer{transition:transform .3s}
.timer.hot{transform:scale(1.22)}
.timer.hot span{color:var(--coral)}
.timer span.pop{animation:tickpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes tickpop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.ptimer{display:inline-block}
.ptimer.pop{animation:tickpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pulse{to{transform:scale(1.12)}}
.duel{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:96px;position:relative}
.av{font-size:3rem;line-height:1;width:78px;height:78px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:3px solid var(--line)}
.who.ok .av{border-color:var(--mint)}
.who .tick{position:absolute;top:-4px;left:6px;background:var(--mint);color:var(--ink);border-radius:999px;font-size:.8rem;font-weight:700;padding:0 8px}
.who .nm{font-weight:700;font-size:1.05rem}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;width:min(1100px,100%)}
.ans{position:relative;background:var(--card);color:var(--ink);border-radius:24px;padding:28px 24px 22px;min-width:0;
  font-size:clamp(1.6rem,3.3vw,2.5rem);font-weight:700;line-height:1.4;box-shadow:0 7px 0 var(--skydeep);transition:transform .5s,opacity .5s,box-shadow .5s;overflow-wrap:anywhere}
.ans .tag{position:absolute;top:-18px;right:20px;background:var(--skydeep);color:var(--cream);font-family:var(--display);font-weight:800;font-size:1.3rem;padding:0 14px;border-radius:10px}
.ans .bar{height:10px;border-radius:6px;background:rgba(15,31,59,.12);margin-top:18px;overflow:hidden}
.ans .bar i{display:block;height:100%;width:0;background:var(--skydeep)}
.ans .bar.anim i{animation:grow 1.4s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.ans .vn{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-top:6px;color:#4a6290}
.ans.win{transform:scale(1.05) rotate(-1deg);box-shadow:0 0 0 6px var(--sun),0 9px 0 var(--skydeep)}
.ans.lose{opacity:.5;transform:scale(.95)}
.answers.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.answers.n3 .ans,.answers.n4 .ans{font-size:clamp(1.2rem,2.2vw,1.8rem);padding:22px 18px 14px}
.answers.n3,.answers.n4{gap:18px}
.stage:has(.answers.n3),.stage:has(.answers.n4){gap:14px;padding-block:10px}
.stage:has(.answers.n3) .qcard,.stage:has(.answers.n4) .qcard{font-size:clamp(1.6rem,3.6vw,2.6rem)}
.answers.n3 .owner,.answers.n4 .owner{font-size:clamp(1.15rem,1.9vw,1.55rem);margin-top:10px;padding:4px 16px 4px 12px}
.answers.n3 .bar,.answers.n4 .bar{margin-top:10px}
.answers.n3 .vn,.answers.n4 .vn{font-size:.95rem;margin-top:2px}
@media (max-width:900px){.answers.n3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ans .acc{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;margin:0 0 8px;font-family:var(--display);font-size:.78em;color:var(--skydeep);line-height:1.2}
.ans .acc .avi{width:1.7em;height:1.7em}
.ans .acc small{flex-basis:100%;font-size:.62em;color:#4a6290;font-family:var(--body)}
.kind.same{font-size:clamp(1.2rem,2.4vw,1.7rem);color:var(--mint);margin:0}
.owner.hop .avi{animation:hop .6s ease 3}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-9px) rotate(-8deg)}}
.thinker{display:flex;flex-direction:column;align-items:center;gap:4px}
.thinker .av.big{width:clamp(84px,9vw,120px);height:clamp(84px,9vw,120px)}
.thinker .qcard{margin-top:2px}
.answers.bubbles{margin-top:10px}
.ans.bubble{border-radius:34px}
.ans.bubble::before{content:"";position:absolute;top:-11px;left:50%;width:22px;height:22px;background:var(--card);transform:translateX(-50%) rotate(45deg);border-radius:4px}
.statrow .owner,.ans .owner,.qitem .owner{margin:16px auto 0;width:fit-content;max-width:100%;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 20px 6px 14px;border-radius:999px;background:var(--ink);color:var(--sun);font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,2.8vw,2.2rem);line-height:1.3;box-shadow:0 4px 0 rgba(15,31,59,.25);animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
.statrow .owner .avi,.ans .owner .avi,.qitem .owner .avi{width:1.5em;height:1.5em}
.qitem .owner{font-size:1.35rem;margin:10px 0 0;padding:4px 16px 4px 12px}
.ans .pts{color:#1f8a6b}
.ans .owner .pts,.qitem .owner .pts{color:var(--mint);font-size:.8em}
@keyframes drop{from{transform:translateY(-30px) scale(.4);opacity:0}}
.banner{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.6vw,3.2rem);color:var(--sun);animation:drop .6s cubic-bezier(.3,1.6,.5,1);margin:0}
.segintro .num{font-family:var(--display);font-weight:800;color:var(--sky);font-size:1.6rem}
.segintro h2{font-size:clamp(2.8rem,8vw,5.4rem);margin:0;color:var(--sun);animation:drop .7s cubic-bezier(.3,1.6,.5,1)}
.segintro p{max-width:44ch;margin:8px auto 0;font-size:1.2rem}
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;width:min(1000px,100%)}
.joinbox{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:260px}
.joinbox .qr{width:170px;height:170px;display:grid;place-items:center}
.joinbox .qr img,.joinbox .qr canvas{width:170px!important;height:170px!important}
.joinbox .jtip{font-weight:700;color:var(--ink);font-size:1rem}
.joinbox .jtip b{font-family:var(--display);letter-spacing:.1em;direction:ltr;display:inline-block}
.joinbox .code2{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:.15em;direction:ltr;color:var(--ink)}
.qrover{position:fixed;inset:0;z-index:20;background:rgba(15,31,59,.85);display:grid;place-items:center;padding:20px}
.qrover .joinbox{max-width:340px}
.qrover .joinbox .qr{width:280px;height:280px}
.qrover .joinbox .qr img,.qrover .joinbox .qr canvas{width:280px!important;height:280px!important}
.joinbox .url{font-size:.75rem;direction:ltr;overflow-wrap:anywhere;color:#4a6290}
.lobbyp{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.who.new{animation:drop .5s}
.empty{border:2px dashed var(--line);border-radius:18px;padding:22px 26px}
.settings{display:flex;flex-direction:column;gap:12px;align-items:center}
.settings .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.board{width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
@media (min-width:900px){.stage .board.many{display:grid;grid-template-columns:1fr 1fr;width:min(1100px,100%)}}
.rowp{display:grid;grid-template-columns:44px 56px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:10px 16px;text-align:start}
.rowp .r{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--muted)}
.rowp .av{width:50px;height:50px;font-size:1.8rem;border-width:2px}
.rowp .nm{font-weight:700;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowp .sc{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--sun);font-variant-numeric:tabular-nums}
.rowp.first{background:var(--sun);color:var(--ink)}
.rowp.first .sc,.rowp.first .r{color:var(--ink)}
.rowp.off{opacity:.5}
.qlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:min(1100px,100%)}
.qitem{background:var(--card);color:var(--ink);border-radius:18px;padding:16px 18px;text-align:start;font-weight:700;font-size:1.15rem;line-height:1.45;position:relative;min-width:0;overflow-wrap:anywhere;box-shadow:0 5px 0 var(--skydeep)}
.qitem .n{font-family:var(--display);font-weight:800;color:var(--skydeep);margin-inline-end:6px}
.qitem .by{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--display);font-weight:800;color:#1f8a6b;animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
.qitem.top{box-shadow:0 0 0 5px var(--sun),0 7px 0 var(--skydeep)}
.small{font-size:.9rem}
.mopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;width:min(900px,100%)}
.mopt{background:var(--card);color:var(--ink);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 7px 0 var(--skydeep);transition:transform .5s,opacity .5s,box-shadow .5s;min-width:0}
.mopt .mic{font-size:3.2rem;line-height:1}
.mopt .mlb{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.4rem)}
.mopt .bar{width:100%;height:12px;border-radius:6px;background:rgba(15,31,59,.12);overflow:hidden}
.mopt .bar i{display:block;height:100%;background:var(--skydeep)}
.mopt .bar.anim i{animation:grow 1.4s cubic-bezier(.2,.8,.2,1)}
.mopt .vn{font-family:var(--display);font-weight:700;color:#4a6290;font-size:1.2rem}
.mopt.win{transform:scale(1.05);box-shadow:0 0 0 6px var(--sun),0 9px 0 var(--skydeep)}
.mopt.lose{opacity:.55;transform:scale(.95)}
.mres{display:flex;flex-direction:column;align-items:center;gap:8px}
.mres .banner{font-size:clamp(1.8rem,4vw,2.6rem)}
.mres .wl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip.big{font-size:1.2rem;padding:4px 16px;background:var(--mint);color:var(--ink);border-color:var(--mint)}
.subj{display:flex;align-items:center;gap:14px}
.av.faces{position:relative}

  c.width=innerWidth; c.height=innerHeight;

  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,s:6+Math.random()*8,c:cols[Math.random()*5|0]}));
  let fr=0; (function loop(){ x.clearRect(0,0,c.width,c.height);
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }
    if(++fr<200) requestAnimationFrame(loop); else c.hidden=true; })();
}

const newCode = () => String(1000 + (Math.random()*9000|0));

function startHost(){
  clearSave();
  Music.init(); Music.setMood("lobby"); Tracks.unlock(); wake();

function openHostPeer(){
  if (!netOK()){ H.net=false; H.netMsg="ما قدرنا نحمّل مكتبة الاتصال، فالتلفونات ما رح تقدر تدخل من هون. البوتات شغالة عادي."; return; }
  try { H.peer?.destroy(); } catch {}
  let peer;
  try { peer = new Peer(NS + H.code); } catch { H.net=false; H.netMsg="الاتصال مش متاح بهالمتصفح. البوتات شغالة عادي."; return; }
  H.peer = peer; H.netMsg = "عم نوصل…";
  peer.on("open", ()=>{ H.net=true; if (!/تغيّر/.test(H.netMsg)) H.netMsg=""; H.resuming=false; hostRender(); });
  peer.on("connection", conn => {
    conn.on("data", d => onHostMsg(conn, d));
    conn.on("close", () => onHostClose(conn));
    conn.on("error", () => onHostClose(conn));

  peer.on("error", e => {
    if (e.type==="unavailable-id"){
      if (H.resuming && (H.claimTries=(H.claimTries||0)+1) <= 12){ H.netMsg="عم نرجّع نفس الكود… لحظات"; hostRender(); setTimeout(openHostPeer, 2500); return; }

/* ---- messages from phones ---- */
const normName = n => String(n||"").replace(/\s+/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();
const STALE_MS = 15000;
function isGone(p){ return !p.bot && (!p.on || !p.conn?.open || Date.now()-(p.seen||0)>STALE_MS); }
function onHostMsg(conn, d){
  if (!d || typeof d!=="object") return;
  if (d.t==="hello" && typeof d.pid==="string"){
    let pid=d.pid.slice(0,24);
    H.kicked.delete(pid);   // kicked players may come back in: they just start a fresh seat
    const name=clean(d.name,16)||"لاعب", av=AVS.includes(d.av)?d.av:AVS[0];
    // one seat per name: the same name always lands on the existing seat (and its score), never a second copy
    const byName=[...H.P.values()].find(x=>!x.bot && normName(x.name)===normName(name));
    let p=H.P.get(pid);
    if (!p && byName){ p=byName; pid=byName.pid; try{ conn.send({t:"you",pid}); }catch{} }
    const keepName = p && byName && byName!==p;      // renaming onto someone else's name is not allowed: keep the old name
    conn._pid=pid;
    if (!p){ p={pid,name,av,score:0,on:true,bot:false,conn,seen:Date.now()}; H.P.set(pid,p); Music.play("pop"); if (H.st.ph==="lobby") announce(p); }
    else {
      const old=p.conn;
      if (!keepName) p.name=name; else try{ conn.send({t:"name",name:p.name}); }catch{}
      p.av=av; p.conn=conn; p.seen=Date.now();
      if (!p.on) Music.play("pop"); p.on=true;
      if (old && old!==conn){ try{ old.send({t:"replaced"}); }catch{} setTimeout(()=>{ try{ old.close(); }catch{} },400); }
    }
    sendTo(p); push(); hostRender(); return;
  }
  const p = H.P.get(conn._pid);
  if (!p || p.conn!==conn){ if (!H.kicked.has(conn._pid)) try{ conn.send({t:"who"}); }catch{} return; }   // we lost track of this phone: ask it to say hello again
  p.seen=Date.now();
  if (!p.on){ p.on=true; push(); hostRender(); }
  if (d.t==="ping") return;
  handleAction(p, d);
}
/* a phone that went quiet (screen off, lost signal) is marked away so nobody waits for it */
setInterval(()=>{
  if (!H.code) return;
  let changed=false;
  for (const p of [...H.P.values()]){
    if (p.bot || !p.on) continue;
    if (Date.now()-(p.seen||0)>STALE_MS){ if (H.st.ph==="lobby") H.P.delete(p.pid); else p.on=false; changed=true; }
  }
  if (changed){ checkDone(); push(); hostRender(); }
}, 3000);
/* a short funny line when someone joins the lobby; it goes away by itself */
const ENTR = {c1:"وصل {n}! جهّزوا الضحك 😂", c2:"وصل {n}… وعنده جواب لكل إشي 🤓", c3:"وصل الباشا {n}! قوموا سلّموا 👑", c4:"{n} صحي أخيرًا وإجا 😴",
  c5:"الزعيم {n} وصل. الكل يهدّي 😎", c6:"{n} وصل… بلّشت الهيصة 🎉", c7:"{n} وصل وشنبه قبله 🥸", c8:"{n} وصل… في منسف؟ 🍖",
  c9:"{n} وصل، والماما مبسوطة 😇", c10:"{n} نزل من الفضاء 👽", c11:"{n} وصل… علّوا الموسيقى 🎧", c12:"الكابتن {n} نزل عالملعب ⚽",
  c13:"العريس {n} وصل! زغرطوا 💐", c14:"{n} وصل… اسقوه شوية ماي 🌱", c15:"{n} وصل. انتبهوا لجيوبكم 😈", c16:"{n} وصل على رواق 🫖"};
function announce(p){
  const id=(String(p.av).match(/^⟦(c\d+)⟧$/)||[])[1], t={text:`${p.av} `+(ENTR[id]||"وصل {n}! 🎉").replace("{n}",p.name), id:Math.random()};

function kickPlayer(pid){
  const p=H.P.get(pid); if (!p) return;

function countLen(p,x){ if (!H.stats||!x) return; const S=H.stats; S.len[p.pid]=(S.len[p.pid]||0)+x.length; S.cnt[p.pid]=(S.cnt[p.pid]||0)+1; }
function countSpeed(p,x,d){ if (!H.stats || d.auto) return; const S=H.stats, sec=(Date.now()-(H.phaseAt||Date.now()))/1000;
  const s=S.spd[p.pid]||(S.spd[p.pid]={sum:0,n:0}); s.sum+=sec; s.n++;
  if (!S.short || x.length<S.short.text.length) S.short={text:x, pid:p.pid}; }
function countAuto(p,d){ if (d.auto && H.stats) H.stats.auto[p.pid]=(H.stats.auto[p.pid]||0)+1; }
function handleAction(p, d){
  const st=H.st;
  if (d.t==="ans" && st.ph==="answer"){
    const pr=H.batch?.prompts.find(x=>x.key===d.k);
    const x=clean(d.x,MAXLEN);
    const okPick = H.seg!==1 || (typeof d.who==="string" && H.P.get(d.who));
    if (pr && pr.pair.includes(p.pid) && x && okPick && !pr.ans[p.pid]){
      pr.ans[p.pid]=x; Music.play("blip"); countAuto(p,d); countLen(p,x); countSpeed(p,x,d);
      if (H.seg===1){ pr.picks[p.pid]=d.who; if (H.stats) H.stats.accused[d.who]=(H.stats.accused[d.who]||0)+1; }
    }
  } else if (d.t==="vote" && st.ph==="vote" && d.k===H.vk && (st.opts||[]).some(o=>o[0]===d.c) && !H.own[p.pid] && !H.votes[p.pid]){
    H.votes[p.pid]=d.c; Music.play("tick");
  } else if (d.t==="q" && st.ph==="write"){
    const x=clean(d.x,QLEN); if (x && !H.wq[p.pid]){ H.wq[p.pid]=x; Used.add(x); Music.play("blip"); countAuto(p,d); }
  } else if (d.t==="ms" && st.ph==="mself" && ["A","B"].includes(d.c) && (H.mAsk[p.pid]||[]).some(x=>x.key===d.k) && !H.mAns[d.k]){
    H.mAns[d.k]=d.c; Music.play("tick");
  } else if (d.t==="mq" && st.ph==="mq" && d.k===H.mk && ["A","B"].includes(d.c) && p.pid!==H.msub && !H.mguess[p.pid]){
    H.mguess[p.pid]=d.c; Music.play("tick");
  } else if (d.t==="jp" && st.ph==="jvote" && d.k===H.jk && p.pid===H.jtarget && (st.opts||[]).some(o=>o[0]===d.c) && !H.jpick){
    H.jpick=d.c; Music.play("blip");
  } else if (false && d.t==="jv" && d.k===H.jk && ["A","B"].includes(d.c) && !H.jown[p.pid] && p.pid!==H.jtarget && !H.jvotes[p.pid]){
    H.jvotes[p.pid]=d.c; Music.play("tick");
  } else if (d.t==="ready" && st.ph==="seg"){
    if (!H.ready[p.pid]){ H.ready[p.pid]=1; Music.play("pop"); }
  } else if (d.t==="wa" && st.ph==="wans"){
    const x=clean(d.x,MAXLEN); if (x && !H.who.ans[p.pid]){ H.who.ans[p.pid]=x; Music.play("blip"); countAuto(p,d); countLen(p,x); }
  } else if (d.t==="g" && st.ph==="wguess" && d.k===H.wk && p.pid!==H.wAuthor && d.id!==p.pid && st.opts.some(o=>o[0]===d.id) && !H.guess[p.pid]){
    H.guess[p.pid]=d.id; Music.play("tick");
  } else if (d.t==="bq" && st.ph==="bestq" && H.bqList.some(q=>q[0]===d.id) && H.bqOwn[p.pid]!==d.id && !H.bq[p.pid]){
    H.bq[p.pid]=d.id; Music.play("tick");
  } else return;
  saveSoon(); checkDone(); push(); hostRender();
}
function onHostClose(conn){
  const p=H.P.get(conn._pid); if (!p || p.conn!==conn) return;
  if (H.st.ph==="lobby") H.P.delete(p.pid); else p.on=false;
  checkDone(); push(); hostRender();
}
function sc(){ return [...H.P.values()].map(p=>[p.pid,p.name,p.av,p.score,p.on?1:0]); }
function meFor(pid){
  const st=H.st, me={};
  if (st.ph==="answer") me.asg=(H.batch?.prompts||[]).filter(x=>x.pair.includes(pid)).map(x=>{ const t=x.target&&H.P.get(x.target); return [x.key,x.label||x.q,x.ans[pid]?1:0, t?[t.name,t.av,x.q]:null]; });
  if (st.ph==="vote"){ me.opt=H.own[pid]||null; me.voted=H.votes[pid]||null; }   // opt set = you wrote one of these, you sit this vote out
  if (st.ph==="write"){ me.done=!!H.wq[pid]; me.sugg=(H.sugg||{})[pid]||[]; }
  if (st.ph==="bestq"){ me.own=H.bqOwn[pid]||null; me.voted=H.bq[pid]||null; }
  if (st.ph==="wans") me.done=!!H.who?.ans[pid];
  if (st.ph==="seg") me.ready=!!H.ready[pid];
  if (st.ph==="mself") me.masg=(H.mAsk[pid]||[]).map(x=>[x.key,x.q,x.a,x.b,H.mAns[x.key]?1:0]);
  if (st.ph==="mq"){ me.sub=pid===H.msub; me.voted=H.mguess[pid]||null; }
  if (st.ph==="mr"){ me.sub=pid===H.msub; me.guess=H.mguess[pid]||null; }
  if (st.ph==="jvote"){ me.role = pid===H.jtarget ? "t" : H.jown[pid] ? "w" : "v"; me.voted = pid===H.jtarget ? H.jpick : H.jvotes[pid]||null; }
  if (st.ph==="wguess"){ me.author=pid===H.wAuthor; me.voted=H.guess[pid]||null; }
  if (st.ph==="wrev"){ me.guess=H.revGuess[pid]||null; me.author=pid===H.wAuthor; }
  return me;
}
function sendTo(p){ if (p.conn?.open) try{ p.conn.send({t:"st", st:{...H.st, sc:sc(), me:meFor(p.pid)}}); }catch{} }
function push(){ for (const p of H.P.values()) if(!p.bot) sendTo(p); }
/* the clock only needs a few bytes: the full picture goes out when something actually changes (and every 5 s, just in case) */
function pushTick(){ const m={t:"tk",pt:H.st.pt,s:H.st.t}; for (const p of H.P.values()) if(!p.bot && p.conn?.open) try{ p.conn.send(m); }catch{} }

/* ---- phase engine ---- */
function setPhase(st, T, onEnd){
  clearInterval(H.iv); H.iv=null; H.tok++; H.closing=false; H.onEnd=onEnd||null; st.pt=H.tok; H.st=st; H.phaseAt=Date.now();
  if (T){ st.t=T; st.T=T; H.iv=setInterval(tick,1000); }
  if (RESUME[st.ph]) saveGame();
  else if (["lobby","final"].includes(st.ph)) clearSave();
  push(); hostRender();
}
/* ---- keep the game safe if the main screen reloads or closes by mistake ----
   We save at every phase where players give input (and after each input). Resuming restarts that phase:
   scores are rolled back to its start too, so nothing is counted twice. */
const SAVE_KEY="mf.game", SAVE_FIELDS=["seg","si","rd","order","batch","di","votes","vk","own","cur","wq","bq","bqOwn","bqList","bqAuthor",
  "who","whoList","whoGuesses","whoOpts","wi","ri","wk","guess","wAuthor","revGuess","ready","mAsk","mAns","mList","mi","mk","mguess","msub",
  "jk","jpick","jvotes","jown","jtarget","stats","allQs","sugg"];
const RESUME = {
  seg: ()=>introDone, answer: ()=>()=>{ H.di=-1; H.seg===8 ? nextJ() : nextDuel(); }, vote: ()=>endVote, write: ()=>endWrite,
  bestq: ()=>endBestQ, wans: ()=>endWhoAns, wguess: ()=>endWho, mself: ()=>endMSelf, mq: ()=>endMaj, jvote: ()=>endJ,
};
let saveTimer=null;
function saveGame(){
  if (!H.code || !RESUME[H.st?.ph]) return;
  try{
    const snap={v:2, at:Date.now(), code:H.code, st:H.st, settings:H.settings, kicked:[...H.kicked],
      P:[...H.P.values()].map(p=>({pid:p.pid,name:p.name,av:p.av,score:p.score,bot:!!p.bot}))};
    for (const k of SAVE_FIELDS) snap[k]=H[k];
    ls.set(SAVE_KEY, JSON.stringify(snap));
  }catch{}
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveGame,400); }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch{} }
function loadSave(){
  try{ const s=JSON.parse(ls.get(SAVE_KEY)||"null"); if (s && s.v===2 && Date.now()-s.at < 6*3600e3 && RESUME[s.st?.ph]) return s; }catch{}
  return null;
}
function resumeGame(){
  const snap=loadSave(); if (!snap) return startHost();
  Music.init(); Tracks.unlock(); wake();
  clearLater();
  for (const k of SAVE_FIELDS) H[k]=snap[k];
  H.settings={...H.settings, ...snap.settings};
  H.kicked=new Set(snap.kicked||[]);
  H.P=new Map(snap.P.map(p=>[p.pid,{...p, on:!!p.bot, conn:null, seen:0}]));
  H.code=snap.code; H.resuming=true; H.claimTries=0;
  Tracks.loadSite().then(()=>{ Tracks.src=undefined; try{ hostRender(); }catch{} });
  openHostPeer();
  const st={...snap.st}, T = st.ph==="seg" ? T_INTRO : Math.max(30, (st.t||0)+15);
  Music.setMood(st.ph==="seg" ? "lobby" : ["vote","mq","jvote","wguess","bestq"].includes(st.ph) ? "vote" : st.ph==="write" ? "write" : "answer");
  setPhase(st, T, RESUME[st.ph]());
  botsAct(); checkDone();
}
function tick(){
  const st=H.st; st.t=Math.max(0,st.t-1);
  if (st.t<=5 && st.t>0) Music.play("tick");
  if (st.t%5===0) push(); else pushTick();
  paintTimer();
  if (st.t<=0){ clearInterval(H.iv); H.iv=null; at(900, finish); }
}
function paintTimer(){
  const el=app.querySelector(".stage .timer"), st=H.st;
  if (!el) return hostRender();
  el.querySelector("span").textContent=st.t; el.style.setProperty("--p",st.T?st.t/st.T:0);
  el.classList.toggle("hot",st.t<=5); el.setAttribute("aria-label",st.t+" ثانية");
  if (st.t<=5 && st.t>0){ const sp=el.querySelector("span"); sp.classList.remove("pop"); void sp.offsetWidth; sp.classList.add("pop"); }
}
function finish(){ if (H.closing) return; H.closing=true; clearInterval(H.iv); H.iv=null; const fn=H.onEnd; H.onEnd=null; fn&&fn(); }
function soon(){ if (!H.closing) at(450, finish); }
function checkDone(){
  const st=H.st, on=online();
  if (st.ph==="answer"){
    const all=H.batch.prompts.every(x=>x.pair.every(pid=>x.ans[pid] || !H.P.get(pid)?.on));
    if (all) soon();
  } else if (st.ph==="vote"){
    const voters=on.filter(p=>!H.own[p.pid]);
    st.vc=voters.filter(p=>H.votes[p.pid]).length; st.vt=voters.length;
    if (voters.every(p=>H.votes[p.pid])) soon();
  } else if (st.ph==="write"){
    if (on.every(p=>H.wq[p.pid])) soon();
  } else if (st.ph==="bestq"){
    st.vc=Object.keys(H.bq).length; st.vt=on.length;
    if (on.every(p=>H.bq[p.pid])) soon();
  } else if (st.ph==="mself"){
    if (on.every(p=>(H.mAsk[p.pid]||[]).every(x=>H.mAns[x.key]))) soon();
  } else if (st.ph==="mq"){
    const g=mGuessers(); st.vc=g.filter(p=>H.mguess[p.pid]).length; st.vt=g.length;
    if (g.every(p=>H.mguess[p.pid])) soon();
  } else if (st.ph==="jvote"){
    const v=jVoters(), t=H.P.get(H.jtarget);
    st.vc=v.filter(p=>H.jvotes[p.pid]).length; st.vt=v.length; st.picked=!!H.jpick;
    if (H.jpick || !t?.on) soon();
  } else if (st.ph==="seg"){
    st.rc=on.filter(p=>H.ready[p.pid]).length; st.rt=on.length;
    if (on.every(p=>H.ready[p.pid])) soon();
  } else if (st.ph==="wans"){
    if (on.every(p=>H.who.ans[p.pid])) soon();
  } else if (st.ph==="wguess"){
    const g=on.filter(p=>p.pid!==H.wAuthor); st.vc=g.filter(p=>H.guess[p.pid]).length; st.vt=g.length;
    if (g.every(p=>H.guess[p.pid])) soon();
  }
}

/* ---- bots (so you can watch the game with few people) ---- */
function syncBots(){
  for (const [k,p] of H.P) if (p.bot) H.P.delete(k);
  BOTS.slice(0,H.settings.bots).forEach(([name,av],i)=>H.P.set("bot"+i,{pid:"bot"+i,name,av,score:0,on:true,bot:true}));
}
function botsAct(){
  const st=H.st, bots=online().filter(p=>p.bot);
  for (const b of bots){
    if (st.ph==="answer") H.batch.prompts.filter(x=>x.pair.includes(b.pid)).forEach((x,i)=>
      at(rnd(6,25)*1000*(i+1), ()=>handleAction(b,{t:"ans",k:x.key,x:pick(BOT_ANS),who:pick(online()).pid,auto:Math.random()<.3?1:0})));
    if (st.ph==="vote" && !H.own[b.pid]) at(rnd(3,14)*1000, ()=>handleAction(b,{t:"vote",k:H.vk,c:pick(st.opts).at(0)}));
    if (st.ph==="write") at(rnd(8,40)*1000, ()=>handleAction(b,{t:"q",x:nextPrompt(Math.random()<.5?"q":"s")}));
    if (st.ph==="mself") (H.mAsk[b.pid]||[]).forEach((x,i)=>at(rnd(2,8)*1000*(i+1), ()=>handleAction(b,{t:"ms",k:x.key,c:pick(["A","B"])})));
    if (st.ph==="mq" && b.pid!==H.msub) at(rnd(2,10)*1000, ()=>handleAction(b,{t:"mq",k:H.mk,c:pick(["A","B"])}));
    if (st.ph==="jvote" && b.pid===H.jtarget) at(rnd(4,14)*1000, ()=>handleAction(b,{t:"jp",k:H.jk,c:pick(st.opts).at(0)}));
    if (st.ph==="seg") at(rnd(2,7)*1000, ()=>handleAction(b,{t:"ready"}));
    if (st.ph==="wans") at(rnd(6,30)*1000, ()=>handleAction(b,{t:"wa",x:pick(BOT_ANS),auto:Math.random()<.3?1:0}));
    if (st.ph==="wguess" && b.pid!==H.wAuthor) at(rnd(3,12)*1000, ()=>{ const ok=st.opts.filter(o=>o[0]!==b.pid); handleAction(b,{t:"g",k:H.wk,id:pick(ok)[0]}); });
    if (st.ph==="bestq") at(rnd(3,14)*1000, ()=>{ const ok=H.bqList.filter(q=>q[0]!==H.bqOwn[b.pid]); if(ok.length) handleAction(b,{t:"bq",id:pick(ok)[0]}); });
  }
}

/* ---- fair rounds: everyone answers the same number of times per round ---- */
function fairPairs(ids){
  const s=shuffle(ids), n=s.length, out=[];
  if (n<2) return out;
  if (n%2===0){ for(let i=0;i<n;i+=2) out.push([s[i],s[i+1]]); }      // each player once
  else { for(let i=0;i<n;i++) out.push([s[i],s[(i+1)%n]]); }          // odd: each player exactly twice
  return shuffle(out);
}
/* 8+ players: split everyone into groups of 3–4 that answer the same question (8 → 4+4, 9 → 3+3+3, 10 → 4+3+3…).
   everyone still answers exactly once per round; fewer players keep the classic 1-on-1 */
function groupsFor(ids){
  const n=ids.length; if (n<BIG) return fairPairs(ids);
  const k=Math.ceil(n/4), s=shuffle(ids), out=[]; let i=0;
  for (let g=0; g<k; g++){ const size=Math.floor(n/k)+(g<n%k?1:0); out.push(s.slice(i,i+size)); i+=size; }
  return shuffle(out);
}
/* «كمّل الجملة»: half the time the sentence has one of the players in it (never one of the people answering it, when possible) */
function sentenceFor(group, ids, seen={}){
  if (ids.length>=3){
    const others=ids.filter(id=>!group.includes(id)), pool=shuffle(others.length?others:ids).sort((a,b)=>(seen[a]||0)-(seen[b]||0));
    const who=H.P.get(pool[0]); if (who) seen[who.pid]=(seen[who.pid]||0)+1;    // spread the names: nobody shows up twice before everyone showed up once
    if (who) return { q:pickFresh(SN,x=>x).replace("{P}", `${who.av} ${who.name}`), qp:who.pid };
  }
  return { q:nextPrompt("s"), qp:null };
}
/* ---- game flow ---- */
function startGame(){
  if (online().length<3) return;
  clearLater();
  for (const p of H.P.values()) p.score=0;
  H.stats={votes:{}, sweeps:{}, right:{}, fooled:{}, auto:{}, seg4start:null, len:{}, cnt:{}, mGuessN:{}, mRight:{}, accused:{}, spd:{}, short:null, best:null};
  H.seg=0; H.si=-1; H.order=activeOrder(); H.ranks={}; Music.play("tada");
  nextSegment();
}
function nextSegment(){
  const order=H.order||activeOrder();
  H.si=(H.si??-1)+1;
  if (H.si>=order.length) return finalScreen();
  H.seg=order[H.si];
  if ([3,4,7,8].includes(H.seg) && online().length<3) return skipSeg(H.seg);
  Music.setMood("lobby"); Music.play("whistle");
  H.ready={};
  setPhase({ph:"seg", seg:H.seg, segi:H.si+1, segn:order.length, rc:0, rt:online().length}, T_INTRO, introDone);
  botsAct();
}
function introDone(){
  if ([1,2].includes(H.seg)){ H.rd=0; return nextRound(); }
  H.rd=1; ({4:startWrite, 3:startWho, 7:startMaj, 8:startJawab}[H.seg])();
}
/* one more round of the same segment if the settings ask for it */
function moreRounds(restart){ if (H.rd < H.settings.rounds){ H.rd++; restart(); return true; } return false; }
function nextRound(){
  H.rd++;

  const ids=online().map(p=>p.pid), stamp=Date.now()%1e6, seen={};
  const prompts=groupsFor(ids).map((pair,i)=>{
    const base={key:`${H.seg}.${H.rd}.${i}.${stamp}`, pair, ans:{}, picks:{}, author:null};
    return H.seg===1 ? {...base, q:pickFresh(MF,x=>x)} : {...base, ...sentenceFor(pair, ids, seen)};
  });

}
function startAnswer(){
  const per={}; for (const x of H.batch.prompts) for (const pid of x.pair) per[pid]=(per[pid]||0)+1;
  const most=Math.max(1,...Object.values(per));
  Music.setMood("answer");
  setPhase({ph:"answer", seg:H.seg, rd:H.rd, rds:rdsFor(H.seg), per:most, np:H.batch.prompts.length}, (T_ANS[H.seg]||T_ANSWER)*most, ()=>{ H.di=-1; H.seg===8 ? nextJ() : nextDuel(); });
  botsAct();
}
/* who did they pick in «مين فينا؟» */
function accOf(x,pid){ const t=x.picks&&x.picks[pid], p=t&&H.P.get(t); return p ? [p.name,p.av,t===pid?1:0] : null; }
function nextDuel(){
  H.di++;

  if (H.di>=prompts.length) return afterBatch();
  const x=prompts[H.di], mult=H.batch.mult;
  const head={seg:H.seg, rd:H.rd, rds:rdsFor(H.seg), di:H.di, dn:prompts.length, q:x.q};
  const done=shuffle(x.pair.filter(pid=>x.ans[pid]));
  if (!done.length){ Music.stop(); Music.play("womp"); setPhase({...head, ph:"reveal", res:{skip:true}}); at(4000,nextDuel); return; }
  if (done.length===1){
    const w=H.P.get(done[0]), votes=Math.max(1,Math.ceil((online().length-x.pair.length)/2)), pts=votes*mult;
    if (w) w.score+=pts;
    Music.stop(); Music.play("tada");
    setPhase({...head, ph:"reveal", res:{solo:true, text:x.ans[done[0]], acc:accOf(x,done[0]), name:w?.name||"", av:w?.av||"", pts}});
    at(5500,nextDuel); return;
  }
  H.vk++; H.votes={}; H.own={}; H.cur={ids:{}};
  const opts=done.map((pid,i)=>{ const k=LETTERS[i]; H.own[pid]=k; H.cur.ids[k]=pid; return [k, x.ans[pid], accOf(x,pid)]; });
  Music.setMood("vote");
  setPhase({...head, ph:"vote", vk:H.vk, opts, vc:0, vt:online().filter(p=>!H.own[p.pid]).length}, T_VOTE_SEG[H.seg]||T_VOTE, endVote);
  botsAct();
}
function endVote(){
  const st=H.st, mult=H.batch.mult, L=st.opts.map(o=>o[0]), x=H.batch.prompts[H.di];
  const cnt=Object.fromEntries(L.map(k=>[k,0])); for (const v of Object.values(H.votes)) if (v in cnt) cnt[v]++;
  const total=L.reduce((t,k)=>t+cnt[k],0), max=Math.max(...L.map(k=>cnt[k]));
  const winners=max>0 ? L.filter(k=>cnt[k]===max) : [], win=winners.length===1 ? winners[0] : "tie";
  // with 3–4 answers on screen the votes are shared by more people, so each vote is worth more: every group is worth the same
  const per = H.batch.big ? mult*L.length/2 : mult;
  const pts=Object.fromEntries(L.map(k=>[k, Math.round(cnt[k]*per/10)*10]));
  const res={cnt,total,win,winners,pts,sweep:false,bonus:0,same:null};
  if (win!=="tie" && total>=2 && cnt[win]===total){ res.sweep=true; res.bonus=mult; pts[win]+=mult; }
  if (H.seg===1){                       // two or more picked the same person: they agree, bonus for each
    const by={}; for (const k of L){ const t=x.picks[H.cur.ids[k]]; if (t) (by[t]=by[t]||[]).push(k); }
    const best=Object.entries(by).filter(([,ks])=>ks.length>=2).sort((a,b)=>b[1].length-a[1].length)[0];
    if (best){ const p=H.P.get(best[0]); res.same={name:p?.name||"", av:p?.av||"", ks:best[1], n:best[1].length}; for (const k of best[1]) pts[k]+=SAME_BONUS; }
  }
  const who=Object.fromEntries(L.map(k=>{ const p=H.P.get(H.cur.ids[k]); return [k,[p?.name||"",p?.av||""]]; }));
  const fast=H.seg===2;
  Music.stop();
  setPhase({...st, ph:"reveal", rv:0, res, t:0});
  at(fast?2000:2600,()=>{ H.st.rv=1; Music.play("roll",fast?1.8:2.4); push(); hostRender(); });
  at(fast?4000:5100,()=>{ H.st.rv=2; H.st.res.who=who;
    for (const k of L){ const p=H.P.get(H.cur.ids[k]); if (p) p.score+=pts[k]; }
    if (H.stats){ const S=H.stats;
      for (const k of L){ const pid=H.cur.ids[k];
        if (H.seg<=2) S.votes[pid]=(S.votes[pid]||0)+cnt[k];
        if (!S.best || cnt[k]>S.best.votes) S.best={votes:cnt[k], text:st.opts.find(o=>o[0]===k)[1], q:st.q, pid, acc:st.opts.find(o=>o[0]===k)[2]}; }
      if (res.sweep){ const w=H.cur.ids[win]; S.sweeps[w]=(S.sweeps[w]||0)+1; } }
    Music.play(total===0?"womp":res.sweep?"applause":"tada"); if(res.sweep) confetti(); push(); hostRender(); });
  at(fast?8500:10500,nextDuel);
}
const rdsFor = seg => H.settings.rounds;
/* the standings screen between segments, with up to two funny lines about who went up or down */
function scoreScreen(seg, then){
  Music.setMood("lobby");
  setPhase({ph:"score", seg, rd:H.rd, rds:rdsFor(seg), cm:standingsLines(), ttl: seg===1 ? accusedTitle() : null});
  at(9000, then);
}
function standingsLines(){
  const ranked=sc().sort((a,b)=>b[3]-a[3]), now={}; ranked.forEach((p,i)=>now[p[0]]=i+1);
  const prev=H.ranks||{}, first=!Object.keys(prev).length, out=[]; H.ranks=now;
  if (ranked.length<2 || ranked[0][3]<=0) return out;
  const nm=p=>`${p[2]} ${p[1]}`, lead=ranked[0];
  if (first) out.push(`${nm(lead)} ${pick(["أول المتصدّرين 🥇","فاتح عالكل 🥇"])}`);
  else if (prev[lead[0]]===1) out.push(`${nm(lead)} ${pick(["متربّع عالقمة 👑","ما حدا قادر عليه 😎","مكيّف فوق 👑"])}`);
  else out.push(`${nm(lead)} ${pick(["خطف المركز الأول! ⚡","قعد عالكرسي الأول 👑"])}`);
  const moves=ranked.filter(p=>prev[p[0]] && p[0]!==lead[0]).map(p=>[p, prev[p[0]]-now[p[0]]]);
  const up=moves.filter(m=>m[1]>0).sort((a,b)=>b[1]-a[1])[0], down=moves.filter(m=>m[1]<0).sort((a,b)=>a[1]-b[1])[0];
  if (up) out.push(`${nm(up[0])} ${up[1]>=2 ? `طالع صاروخ 🚀 (+${up[1]} مراكز)` : pick(["طالع صاروخ 🚀","ولّع! 🔥","مين وقّفه؟ 💨"])}`);
  else if (down) out.push(`${nm(down[0])} ${pick(["نازل نازل 📉","وقع عن الدرج 🪜","بدّه فزعة 🆘"])}`);
  else if (ranked.length>=3) out.push(`${nm(ranked.at(-1))} ${pick(["لسا بيسخّن 🐢","بيلعب على مهله 🫖"])}`);
  return out.slice(0,2);
}
function accusedTitle(){
  const best=Object.entries(H.stats?.accused||{}).filter(([pid])=>H.P.get(pid)).sort((a,b)=>b[1]-a[1])[0];
  if (!best || best[1]<2) return null; const p=H.P.get(best[0]);
  return `🎯 المتّهَم الأول: ${p.av} ${p.name} (${cnt(best[1],"مرة","مرتين","مرات","مرة")})`;

/* segment 7: "what did they pick?" everyone answers their own two-option question in secret,

function startMaj(){
  const ps=online(), per = ps.length<=4 ? 2 : 1, stamp=Date.now()%1e6;
  H.mAsk={}; H.mAns={};
  ps.forEach((p,i)=>{ H.mAsk[p.pid]=[]; for (let j=0;j<per;j++){ const [q,a,b]=pickFresh(MQ, x=>x[0]); H.mAsk[p.pid].push({key:`7.${i}.${j}.${stamp}`, q, a, b}); } });

function endMSelf(){
  const list=[];
  for (const [pid,qs] of Object.entries(H.mAsk)) for (const x of qs) if (H.mAns[x.key] && H.P.get(pid)?.on) list.push({...x, pid, c:H.mAns[x.key]});
  // shuffle, then avoid the same person twice in a row where possible
  let l=shuffle(list); for (let i=1;i<l.length;i++) if (l[i].pid===l[i-1].pid){ const j=l.findIndex((x,k)=>k>i && x.pid!==l[i].pid); if (j>0) [l[i],l[j]]=[l[j],l[i]]; }

function computeAwards(){
  const S=H.stats; if (!S) return [];
  const seg4={}, long={}, myst={};
  if (S.seg4start) for (const p of H.P.values()) seg4[p.pid]=p.score-(S.seg4start[p.pid]||0);
  for (const [pid,c] of Object.entries(S.cnt||{})) if (c>=2) long[pid]=Math.round((S.len[pid]||0)/c);
  for (const [pid,n] of Object.entries(S.mGuessN||{})) if (n>0) myst[pid]=(S.mRight[pid]||0)/n;
  const src={votes:S.votes, sweeps:S.sweeps, right:S.right, fooled:S.fooled, seg4, long, myst, auto:S.auto};
  const out=[];
  for (const a of AWARDS){
    const m=Object.fromEntries(Object.entries(src[a.key]||{}).filter(([pid])=>H.P.get(pid)));
    const vals=Object.values(m); if (!vals.length) continue;
    const best = a.dir==="min" ? Math.min(...vals) : Math.max(...vals);
    if (a.dir==="min" ? best>0.5 : best<=0) continue;        // nobody really earned it: skip the award
    let winners=Object.entries(m).filter(([,v])=>v===best).map(([pid])=>H.P.get(pid));
    if (winners.length>1){                                     // tie: the higher total score takes it
      const top=Math.max(...winners.map(p=>p.score)); winners=winners.filter(p=>p.score===top);
    }
    out.push({icon:a.icon, title:a.title, why:a.why(best), who:winners.map(p=>[p.pid,p.name,p.av])});
  }
  return out;
}

const P = { ms:{}, pick:{}, out:[], peer:null, conn:null, pid:null, name:"", av:"", code:"", st:null, sentA:{}, sentV:{}, sentQ:false, draft:"", draftKey:"", sig:null, found:false, retry:null };
function myPid(){ let id=ls.get("mf.pid"); if(!id){ id=Math.random().toString(36).slice(2,12); ls.set("mf.pid",id);} return id; }

function joinForm(err, preset){
  P.sig=null;

  name.value=ls.get("mf.name")||"";

  const drawAv=()=>grid.replaceChildren(...AVS.map(a=>h("button",{type:"button","aria-pressed":String(a===av),"aria-label":CHAR_BY[a].name,onclick:()=>{ av=a; drawAv(); }},
      h("span",{class:"avc"},a), h("span",{class:"avn"},CHAR_BY[a].name))));
  drawAv();
  const picker=grid;
  const form=h("form",{class:"pmain",onsubmit:e=>{e.preventDefault(); const c=code.value.replace(/\D/g,""), n=clean(name.value,16);
      if(c.length!==4) return joinForm("الكود 4 أرقام، شوفه على الشاشة الرئيسية.", c); if(!n) return joinForm("اكتب اسمك أول.", c);
      ls.set("mf.name",n); ls.set("mf.av",av); playerJoin(c,n,av);}},
    h("h1",{class:"disp big"},"ادخل اللعبة"),
    h("label",{class:"lbl",for:"jcode"},"كود الغرفة"), code,
    h("label",{class:"lbl",for:"jname"},"اسمك"), name,
    h("span",{class:"lbl"},"شخصيتك"), picker,
    err ? h("div",{class:"warn",role:"alert"},err) : null,
    h("button",{class:"btn",type:"submit"},"دخول"),
    h("button",{class:"btn ghost",type:"button",onclick:()=>home()},"رجوع"));
  app.replaceChildren(h("div",{class:"phone"},form));

}
function status(msg, sub){ P.sig=null; app.replaceChildren(h("div",{class:"phone"},h("div",{class:"pmain"},h("p",{class:"big"},msg), sub?h("p",{class:"muted center"},sub):null))); }

function playerJoin(code,name,av){
  P.code=code; P.name=name; P.av=av; P.pid=myPid(); P.found=false; P.kicked=false; wake();
  ls.set("mf.last", JSON.stringify({code, at:Date.now()}));
  if (!netOK()) return joinForm("ما قدرنا نحمّل مكتبة الاتصال. تأكد إنك فاتح رابط اللعبة الأصلي ومعك إنترنت.", code);
  status("عم ندوّر على الغرفة…", `الكود ${code}`);
  try { P.peer?.destroy(); } catch {}
  P.peer=new Peer();
  P.peer.on("open", connectHost);
  P.peer.on("error", e=>{
    if (e.type==="peer-unavailable"){ if (!P.found) joinForm(`ما لقينا لعبة بالكود ${code}. تأكد من الرقم على الشاشة.`, code); else retryLater(); }
    else if (!P.found) joinForm("ما قدرنا نتصل. جرّب كمان مرة، ويفضل تكونوا على نفس الواي فاي.", code);
    else retryLater();
  });
  P.peer.on("disconnected", ()=>{ try{ P.peer.reconnect(); }catch{} });
}
function connectHost(){
  const conn=P.peer.connect(NS+P.code,{reliable:true,serialization:"json"});
  P.conn=conn;
  conn.on("open", ()=>{ P.found=true; conn.send({t:"hello",pid:P.pid,name:P.name,av:P.av}); flush(); });
  conn.on("data", d=>{
    if (P.conn!==conn) return;                      // messages for an older link of this same phone
    if (d && d.t==="replaced"){ P.kicked=true; clearTimeout(P.retry); P.retry=null; replacedScreen(); return; }
    if (d && d.t==="name" && typeof d.name==="string"){ P.name=d.name; ls.set("mf.name",d.name); P.sig=null; return; }
    if (d && d.t==="who"){ try{ conn.send({t:"hello",pid:P.pid,name:P.name,av:P.av}); }catch{} return; }
    if (d && d.t==="you" && typeof d.pid==="string"){ P.pid=d.pid; ls.set("mf.pid",d.pid); P.sig=null; return; }
    if (d && d.t==="kicked"){ P.kicked=true; clearTimeout(P.retry); P.retry=null; try{ P.peer?.destroy(); }catch{} kickedScreen(); return; }
    if (d && d.t==="tk"){ if (P.st && P.st.pt===d.pt){ P.st.t=d.s; playerRender(); } return; }
    if (d && d.t==="st"){ P.st=d.st; P.out=P.out.filter(o=>o.pt===d.st.pt && !confirmed(o.msg,d.st)); playerRender(); } });
  conn.on("close", ()=>{ if (P.conn===conn && !P.kicked) retryLater(); });
  conn.on("error", ()=>{ if (P.conn===conn && !P.kicked) retryLater(); });
}
function retryLater(){
  if (P.retry || P.kicked) return;
  status("انقطع الاتصال… عم نرجع","لا تسكّر الصفحة، بترجع لحالك");
  P.retry=setTimeout(()=>{
    P.retry=null; if (P.kicked) return;
    if (!P.peer || P.peer.destroyed){ rejoin(); return; }               // the signalling link died: start a fresh one, same seat
    if (P.peer.disconnected) try{ P.peer.reconnect(); }catch{}
    connectHost();
  },2000);
}
function rejoin(){
  try{ P.peer?.destroy(); }catch{}
  P.peer=new Peer();
  P.peer.on("open", connectHost);
  P.peer.on("error", ()=>retryLater());
  P.peer.on("disconnected", ()=>{ try{ P.peer.reconnect(); }catch{} });
}
function replacedScreen(){
  P.sig=null;
  app.replaceChildren(h("div",{class:"phone"},h("div",{class:"pmain"},
    h("p",{class:"big"},"📱"), h("p",{class:"big"},`في حدا دخل باسم «${P.name}»`),
    h("p",{class:"muted center"},"إذا إنت دخلت من جهاز ثاني، كمّل من هناك. إذا مش إنت، ادخل باسم ثاني."),
    h("button",{class:"btn",onclick:()=>{ P.kicked=false; playerJoin(P.code,P.name,P.av); }},"هاد أنا، رجّعني هون"),
    h("button",{class:"btn ghost",onclick:()=>{ P.kicked=false; ls.set("mf.name",""); joinForm(null,P.code); }},"ادخل باسم ثاني"))));
}
function kickedScreen(){
  P.sig=null;
  app.replaceChildren(h("div",{class:"phone"},h("div",{class:"pmain"},
    h("p",{class:"big"},"🚪"), h("p",{class:"big"},"طلعت من اللعبة"),

    h("button",{class:"btn ghost",onclick:()=>{ P.kicked=false; home(); }},"رجوع"))));

/* heartbeat so the main screen knows this phone is still here; and reconnect straight away when the phone wakes up */
setInterval(()=>{ try{ if (P.conn?.open && !P.kicked) P.conn.send({t:"ping"}); }catch{} }, 4000);
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState!=="visible" || !P.code || P.kicked || !P.found) return;
  if (!P.conn?.open){ clearTimeout(P.retry); P.retry=null; retryLater(); }
});
function send(msg){ P.out.push({msg, pt:P.st?.pt}); flush(); }
function flush(){ if (!P.conn?.open) return; for (const o of P.out) try{ P.conn.send(o.msg); }catch{} }
function confirmed(m, st){
  const me=st.me||{};
  if (m.t==="ans") return !!(me.asg||[]).find(a=>a[0]===m.k)?.[2];
  if (m.t==="q"||m.t==="wa") return !!me.done;
  if (m.t==="ready") return !!me.ready;
  if (m.t==="mq"||m.t==="jp"||m.t==="jv") return !!me.voted;
  if (m.t==="ms") return !!(me.masg||[]).find(x=>x[0]===m.k)?.[4];
  return !!me.voted;      // vote, g, bq
}
setInterval(()=>{ if (P.out.length) flush(); }, 2000);

function writeBox(id, maxlen, placeholder, key){
  if (P.draftKey!==key){ P.draftKey=key; P.draft=""; }
  const area=h("textarea",{class:"field",id,maxlength:String(maxlen),placeholder});
  area.value=P.draft;
  const cnt=h("div",{class:"count muted"},`${area.value.length}/${maxlen}`);
  area.addEventListener("input",()=>{P.draft=area.value; cnt.textContent=`${area.value.length}/${maxlen}`;});
  return [area,cnt];
}
/* one coloured line on the phone that always says what to do right now: yellow = your turn, blue = look at the screen, grey = wait */
function doLine(st, me, f){
  if (!st) return ["",""];
  const look=["👀 عيونكم عالشاشة","look"], wait=t=>["⏳ "+t,"wait"], act=t=>[t,"act"];
  switch (st.ph){
    case "lobby": return wait("استنى لحد ما تبلّش اللعبة");
    case "seg": return (me.ready||P.sentV["r"+st.pt]) ? wait("بنستنى الباقي يجهزوا") : act("📖 اقرأ القواعد واكبس جاهز");
    case "answer": return f.cur ? act({1:"👆 اختار حدا واكتب ليش", 2:"✍️ كمّل الجملة بأضحك طريقة", 4:"✍️ جاوب على سؤال صاحبك", 8:"🎭 جاوب كأنك هو"}[st.seg]||"✍️ اكتب جوابك") : wait("استنى الباقي يخلّصوا");
    case "vote": return me.opt ? ["🤞 جوابك عالشاشة","look"] : f.voted ? wait("استنى النتيجة") : act("👆 اختار الأضحك");
    case "wans": return f.wrote ? wait("استنى الباقي") : act("✍️ جاوب على السؤال، سرًّا");
    case "wguess": return me.author ? ["🤫 هاد جوابك، ولا كلمة!","look"] : f.voted ? wait("استنى الباقي") : act("🤔 احزر مين كتب هالجواب");
    case "write": return f.wrote ? wait("استنى الباقي") : act("✍️ اكتب سؤال أو اختار واحد جاهز");
    case "mself": return f.mcur ? act("🤫 جاوب عن حالك") : wait("استنى الباقي");
    case "mq": return me.sub ? ["😐 خلّي وجهك عادي","look"] : f.voted ? wait("استنى نشوف شو اختار") : act(`🔮 احزر شو اختار ${st.sn[0]}`);
    case "jvote": return me.role==="t" && !f.voted ? act("🎯 اختار الأقرب إلك") : look;
    case "bestq": return f.voted ? wait("استنى النتيجة") : act("👑 صوّت لأحلى سؤال");
    case "score": return ["🏆 هيك الترتيب لهلّأ","look"];
    default: return look;
  }
}

    const t=st.top||[], me1=(p)=>p&&p[0]===P.pid;
    const line=(p,label)=> me1(p) ? `${label}: إنت! 🎉` : `${label}: ${p[2]} ${p[1]}`;
    const msg = st.rv===0 ? "🥁 النتيجة النهائية…" : st.rv===1 ? line(t[2],"🥉 الثالث") : st.rv===2 ? line(t[1],"🥈 الثاني") : st.rv===3 ? "🥁🥁🥁 والأول…" : (me1(t[0])?["👑 إنت",h("br"),"ملك الضحك!"]:[`👑 ${t[0][2]} ${t[0][1]}`,h("br"),"ملك الضحك!"]);
    body=[h("p",{class:"big"},msg), h("p",{class:"muted center"},"عيونكم عالشاشة الكبيرة!")];
  }
  else if (st.ph==="score"||st.ph==="final"){
    const sorted=[...(st.sc||[])].sort((a,b)=>b[3]-a[3]); const rank=sorted.findIndex(s=>s[0]===P.pid)+1;
    body=[h("p",{class:"big"}, st.ph==="final" ? (rank===1?["👑 إنت",h("br"),"ملك الضحك!"]:`خلصت! ترتيبك ${rank}`) : `ترتيبك ${rank||"-"} من ${sorted.length}`), board(sorted,P.pid)];
  }
  const [dlText,dlTone]=doLine(st,me,{cur,voted,wrote,mcur,mtot});
  app.replaceChildren(h("div",{class:"phone"}, top, dlText ? h("div",{class:"doline "+dlTone, role:"status"}, dlText) : null, h("main",{class:"pmain"},body)));
  if (hadFocus) setTimeout(()=>{ const a=document.querySelector(".phone textarea"); if(a){ a.focus(); a.setSelectionRange(a.value.length,a.value.length); } },0);
}

/* ================= boot ================= */
const preset=new URLSearchParams(location.search).get("c");
let lastGame=null; try{ lastGame=JSON.parse(ls.get("mf.last")||"null"); }catch{}
const recent = lastGame && Date.now()-lastGame.at < 3*3600e3;
const savedName=ls.get("mf.name"), savedAv=ls.get("mf.av");
if (preset && /^\d{4}$/.test(preset)){
  if (recent && lastGame.code===preset && savedName && AVS.includes(savedAv)) playerJoin(preset, savedName, savedAv);   // refreshed mid-game: straight back in
  else joinForm(null, preset);
} else home();
</script>
